<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baru Sadar - Official Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0d0e12;
            --card-bg: rgba(22, 25, 34, 0.85);
            --card-border: rgba(255, 107, 0, 0.25);
            --card-hover-border: rgba(255, 107, 0, 0.85);
            --primary-orange: #ff6b00;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Ambient Glow */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

        .container {
            width: 100%;
            max-width: 400px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Profile Card */
        .profile-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 108px;
            height: 108px;
            margin-bottom: 16px;
        }

        .avatar-glow {
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            border-radius: 32px;
            filter: blur(10px);
            opacity: 0.7;
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; filter: blur(8px); }
            100% { opacity: 0.95; filter: blur(14px); }
        }

        .avatar-img {
            position: relative;
            width: 100%;
            height: 100%;
            background: #161922;
            border-radius: 28px;
            border: 2px solid rgba(255, 107, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .channel-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .channel-tag {
            display: inline-block;
            background: rgba(255, 107, 0, 0.15);
            color: var(--primary-orange);
            border: 1px solid rgba(255, 107, 0, 0.3);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .channel-bio {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 300px;
            line-height: 1.5;
        }

        /* Links Section */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 0, 0.12), transparent);
            transition: left 0.5s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--card-hover-border);
            box-shadow: 0 8px 24px rgba(255, 107, 0, 0.3);
        }

        .link-card:active {
            transform: translateY(0);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: none;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 107, 0, 0.12);
            border: 1px solid rgba(255, 107, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
            flex-shrink: 0;
        }

        .link-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .link-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .link-desc {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .arrow-icon {
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
            pointer-events: none;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--primary-orange);
        }

        /* Action Buttons */
        .action-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 4px;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: var(--primary-orange);
            background: rgba(255, 107, 0, 0.12);
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn svg {
            color: var(--primary-orange);
        }

        .action-btn.liked {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
            background: rgba(255, 107, 0, 0.18);
        }

        footer {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-orange);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-card">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <div class="avatar-img">
                    <svg width="100%" height="100%" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="400" height="400" fill="#0D0E12"/>
                        <path d="M305 100L295 130" stroke="#F6D336" stroke-width="12" stroke-linecap="round"/>
                        <path d="M325 130L350 115" stroke="#F6D336" stroke-width="12" stroke-linecap="round"/>
                        <path d="M335 160L365 165" stroke="#F6D336" stroke-width="12" stroke-linecap="round"/>
                        <rect x="95" y="105" width="210" height="210" rx="55" fill="#F26532"/>
                        <path d="M200 138V215" stroke="white" stroke-width="26" stroke-linecap="round"/>
                        <circle cx="200" cy="260" r="14" fill="white"/>
                    </svg>
                </div>
            </div>
            <h1 class="channel-title">Baru Sadar</h1>
            <span class="channel-tag">@barusadar.fakta</span>
            <p class="channel-bio">Fakta unik, edukasi menarik, & pengetahuan seru sehari-hari!</p>
        </div>

        <!-- Links Buttons -->
        <div class="links-container">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@barusadar.fakta" onclick="openApp(event, 'tiktok')" class="link-card">
                <div class="link-left">
                    <div class="icon-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V5.8a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 12a6.34 6.34 0 0 0 10.86 4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.86z"/>
                        </svg>
                    </div>
                    <div class="link-info">
                        <span class="link-title">TikTok</span>
                        <span class="link-desc">Tonton video seru & Like + Follow!</span>
                    </div>
                </div>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/barusadar_fakta" onclick="openApp(event, 'instagram')" class="link-card">
                <div class="link-left">
                    <div class="icon-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </div>
                    <div class="link-info">
                        <span class="link-title">Instagram</span>
                        <span class="link-desc">Lihat konten edukasi & Like + Follow!</span>
                    </div>
                </div>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@barusadar-fakta" onclick="openApp(event, 'youtube')" class="link-card">
                <div class="link-left">
                    <div class="icon-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                    <div class="link-info">
                        <span class="link-title">YouTube</span>
                        <span class="link-desc">Tonton video & Like + Subscribe!</span>
                    </div>
                </div>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="action-btn" id="shareBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                Bagikan
            </button>
            <button class="action-btn" id="likeBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span id="likeCount">...</span> Suka
            </button>
        </div>

        <footer>
            &copy; 2026 Baru Sadar. All Rights Reserved.
        </footer>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Link berhasil disalin!</div>

    <script>
        // ----------------------------------------------------
        // 1. Database Real-Time Global Firestore Counter
        // ----------------------------------------------------
        const firebaseConfig = {
            projectId: "barusadar-fakta-links"
        };
        
        let db = null;
        let likeRef = null;
        let currentLikes = 0;
        let hasLiked = localStorage.getItem('barusadar_liked') === 'true';

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            likeRef = db.collection('stats').doc('like_counter');

            // Synchronize with global real-time database listener
            likeRef.onSnapshot((doc) => {
                if (doc.exists) {
                    currentLikes = doc.data().count || 0;
                    document.getElementById('likeCount').textContent = currentLikes;
                } else {
                    likeRef.set({ count: 128 });
                }
            }, (error) => {
                document.getElementById('likeCount').textContent = 128;
            });
        } catch (e) {
            document.getElementById('likeCount').textContent = 128;
        }

        const likeBtn = document.getElementById('likeBtn');
        if (hasLiked) {
            likeBtn.classList.add('liked');
        }

        likeBtn.addEventListener('click', () => {
            if (!hasLiked) {
                hasLiked = true;
                localStorage.setItem('barusadar_liked', 'true');
                likeBtn.classList.add('liked');
                showToast('Terima kasih atas dukungannya! ❤️');

                if (db && likeRef) {
                    likeRef.update({
                        count: firebase.firestore.FieldValue.increment(1)
                    }).catch(() => {
                        currentLikes++;
                        document.getElementById('likeCount').textContent = currentLikes;
                    });
                } else {
                    currentLikes++;
                    document.getElementById('likeCount').textContent = currentLikes;
                }
            } else {
                hasLiked = false;
                localStorage.setItem('barusadar_liked', 'false');
                likeBtn.classList.remove('liked');

                if (db && likeRef) {
                    likeRef.update({
                        count: firebase.firestore.FieldValue.increment(-1)
                    }).catch(() => {
                        currentLikes = Math.max(0, currentLikes - 1);
                        document.getElementById('likeCount').textContent = currentLikes;
                    });
                } else {
                    currentLikes = Math.max(0, currentLikes - 1);
                    document.getElementById('likeCount').textContent = currentLikes;
                }
            }
        });

        // ----------------------------------------------------
        // 2. Direct-to-App Smart Launcher (Android & iOS)
        // ----------------------------------------------------
        function openApp(event, platform) {
            event.preventDefault();
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            const targets = {
                tiktok: {
                    android: "intent://www.tiktok.com/@barusadar.fakta#Intent;package=com.ss.android.ugc.trill;scheme=https;end;",
                    ios: "snssdk1128://user/profile/@barusadar.fakta",
                    web: "https://www.tiktok.com/@barusadar.fakta"
                },
                
                instagram: {
                    android: "intent://instagram.com/_u/barusadar_fakta/#Intent;package=com.instagram.android;scheme=https;end;",
                    ios: "instagram://user?username=barusadar_fakta",
                    web: "https://www.instagram.com/barusadar_fakta"
                },
                                youtube: {
                    android: "intent://www.youtube.com/@barusadar-fakta#Intent;package=com.google.android.youtube;scheme=https;end;",
                    ios: "youtube://www.youtube.com/@barusadar-fakta",
                    web: "https://www.youtube.com/@barusadar-fakta"
                }
            };

            const link = targets[platform];

            if (isAndroid) {
                window.location.href = link.android;
            } else if (isIOS) {
                const now = Date.now();
                window.location.href = link.ios;
                setTimeout(() => {
                    if (Date.now() - now < 2000) {
                        window.location.href = link.web;
                    }
                }, 1200);
            } else {
                window.open(link.web, '_blank');
            }
        }

        // ----------------------------------------------------
        // 3. Share & Copy Link Functionality
        // ----------------------------------------------------
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');

        shareBtn.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Baru Sadar - Official Links',
                        text: 'Kunjungi akun media sosial resmi Baru Sadar!',
                        url: window.location.href,
                    });
                } catch (err) {
                    copyToClipboard();
                }
            } else {
                copyToClipboard();
            }
        });

        function copyToClipboard() {
            navigator.clipboard.writeText(window.location.href);
            showToast('Link profil berhasil disalin!');
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
